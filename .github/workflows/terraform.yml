# ============================================================================
# WORKFLOW ACTIVO: Terraform CI (reducido, sin OIDC)
# ----------------------------------------------------------------------------
# Este es el workflow que SÍ se puede usar en el tenant actual.
#
# Qué hace:
# - Ejecuta terraform fmt -check -recursive
# - Ejecuta terraform init SIN backend remoto (-backend=false)
# - Ejecuta terraform validate
#
# Por qué se usa este workflow:
# - En este tenant no es posible usar GitHub Actions + Azure OIDC porque:
#   1) No tenemos privilegios para crear/gestionar una App Registration
#      en Microsoft Entra ID.
#   2) Sin App Registration (o Managed Identity) + Federated Credential,
#      azure/login@v2 NO puede autenticarse por OIDC.
#   3) Por lo tanto, no se pueden obtener/usar:
#         AZURE_CLIENT_ID
#         AZURE_TENANT_ID
#         AZURE_SUBSCRIPTION_ID
#
# Este workflow reducido NO cumple el requerimiento OIDC completo del lab,
# pero sí deja evidencia de CI funcional con fmt + validate.
# ============================================================================

name: Terraform

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "infra/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  checks:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      # Verifica formato de todos los archivos Terraform del repo
      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      # Inicializa módulos y providers, pero SIN backend remoto de Azure.
      # Esto evita depender de OIDC / Azure login en GitHub Actions.
      - name: Terraform Init (sin backend remoto)
        run: terraform -chdir=infra init -backend=false -input=false

      # Valida sintaxis, tipos y wiring de módulos
      - name: Terraform Validate
        run: terraform -chdir=infra validate -no-color

# ============================================================================
# WORKFLOW OIDC DE REFERENCIA (COMPLETAMENTE COMENTADO)
# ----------------------------------------------------------------------------
# Esta es la versión "ideal" / completa que sí se alinea con el lab:
# - fmt + validate + plan en pull_request
# - apply manual con workflow_dispatch + environment
# - autenticación a Azure por OIDC (sin secretos largos)
# - artifact del plan
# - comentario del plan en el PR
#
# PERO NO SE PUEDE USAR EN EL TENANT ACTUAL porque:
# - Azure Login con OIDC requiere una App Registration (o UAMI) en Entra ID
#   + una Federated Credential + secrets:
#       AZURE_CLIENT_ID
#       AZURE_TENANT_ID
#       AZURE_SUBSCRIPTION_ID
# - En este tenant, la cuenta no tiene privilegios suficientes para crear o
#   administrar App Registrations / Federated Credentials.
# - Sin esa configuración previa en Azure, azure/login@v2 falla.
#
# Se deja aquí como evidencia/documentación de cómo sería la solución completa.
# Para activarlo en el futuro, bastaría con:
# 1) Descomentar todo este bloque.
# 2) Comentar o eliminar el workflow reducido de arriba.
# 3) Crear los GitHub Secrets requeridos.
# 4) Configurar en Azure la App Registration / Federated Credential / RBAC.
# ============================================================================

